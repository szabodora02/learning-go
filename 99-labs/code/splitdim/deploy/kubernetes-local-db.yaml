apiVersion: apps/v1
kind: Deployment
metadata:
  name: splitdim
  labels:
    app: splitdim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: splitdim
  template:
    metadata:
      labels:
        app: splitdim
    spec:
      containers:
      - name: splitdim
        image: localhost/splitdim

---
apiVersion: v1
kind: Service
metadata:
  name: splitdim
spec:
  selector:
    app: splitdim
  type: LoadBalancer
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
