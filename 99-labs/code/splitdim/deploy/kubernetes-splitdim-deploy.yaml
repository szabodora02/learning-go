apiVersion: apps/v1
kind: Deployment
metadata:
  name: splitdim
  labels:
    app: splitdim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: splitdim
  template:
    metadata:
      labels:
        app: splitdim
    spec:
      containers:
      - name: splitdim
        image: szabodora237/splitdim:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: KVSTORE_MODE
          valueFrom:
            configMapKeyRef:
              name: splitdim-config
              key: kvstoreMode
              optional: true
        - name: KVSTORE_ADDR
          valueFrom:
            configMapKeyRef:
              name: splitdim-config
              key: kvstoreAddr
              optional: true
        resources:
          requests:
            cpu: "100m"
          limits:
            cpu: "100m"
